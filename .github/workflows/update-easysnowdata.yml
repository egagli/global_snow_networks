name: Update easysnowdata

# Raise the easysnowdata pin and regenerate pixi.lock with pixi, then open a
# PR. Run by hand (Actions → Update easysnowdata → Run workflow) once a
# release has reached conda-forge, which is where this repo installs it
# from: PyPI alone is not enough.
#
# A push made with GITHUB_TOKEN does not start other workflows, so CI would
# not run on the new branch; the tests run here instead, before the push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "easysnowdata version on conda-forge, e.g. 0.3.5"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: update-easysnowdata-${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.3.5, got '$VERSION'"
            exit 1
          fi
          if ! curl -fsS "https://api.anaconda.org/package/conda-forge/easysnowdata" \
              | python3 -c "import json,sys,os; sys.exit(os.environ['VERSION'] not in json.load(sys.stdin)['versions'])"; then
            echo "::error::easysnowdata $VERSION is not on conda-forge yet; merge the feedstock PR and wait for its build."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          run-install: false

      - name: Raise the pin and regenerate the lock
        run: pixi add "easysnowdata>=$VERSION"

      - name: Run the tests on the new lock
        run: pixi run -e dev test

      - name: Push a branch and open a PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add pixi.toml pixi.lock
          git commit -m "Require easysnowdata $VERSION"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Require easysnowdata $VERSION" \
            --body "Raises the pin to easysnowdata>=$VERSION and regenerates pixi.lock (workflow run ${{ github.run_id }}). The tests passed on the new lock in that run." \
          || echo "::notice::Could not open the PR (Actions may not be allowed to create PRs in this repo's settings). Open it at https://github.com/${{ github.repository }}/compare/main...$BRANCH"
