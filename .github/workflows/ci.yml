name: CI

on:
  push:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: dev

      # One suite on both triggers. The live client tests moved to
      # easysnowdata with the clients, so everything left here is offline
      # and takes a second — including the inventory contract test, which
      # is the thing worth running after the daily refresh has committed
      # a new all_snow_stations.geojson.
      - name: Run tests
        run: pixi run -e dev test
