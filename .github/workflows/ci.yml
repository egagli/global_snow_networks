name: CI

on:
  push:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: dev

      # Pushes run only the fast offline suite; the full live-API suite
      # runs when invoked from the daily pipeline (workflow_call), which
      # is when fresh upstream data is actually worth validating.
      - name: Run offline unit tests
        if: github.event_name == 'push'
        run: pixi run -e dev test-unit

      - name: Run full test suite (offline + live API)
        if: github.event_name != 'push'
        env:
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: pixi run -e dev test
