name: CI

on:
  push:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to test (default the triggering commit)
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The daily run passes main: its own commit predates the data
          # finalize just committed, which is what the contract tests check
          # (they missed two failures that way on 2026-11-06).
          ref: ${{ inputs.ref || github.sha }}

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: dev

      # One suite on both triggers. The live client tests moved to
      # easysnowdata with the clients, so everything left here is offline
      # and takes a second — including the inventory contract test, which
      # is the thing worth running after the daily refresh has committed
      # a new all_snow_stations.geojson.
      - name: Run tests
        run: pixi run -e dev test
