[workspace]
name = "global-snow-networks"
version = "0.1.0"
description = "Documented inventory, daily archive and live map of global snow point observations (SWE, snow depth) from AWDB, CDEC, DataBC, NVE, and Yukon AquaCache. The network clients live in easysnowdata."
authors = ["Eric Gagliano <egagli@uw.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12"
ipykernel = "*"
numpy = ">=1.26"
pandas = ">=2.2"
# Not imported by the scripts; the README and docs examples use it.
geopandas = ">=1.0"
requests = ">=2.31"
# The chunked form of the archive (scripts/build_zarr_archive.py). Both
# already arrive through easysnowdata; declared so the build does not
# depend on that staying true.
xarray = ">=2026.7"
zarr = ">=3.3"
# The five network clients and the water-year helpers live in easysnowdata,
# not in this repo (docs/EASYSNOWDATA_MIGRATION.md). 0.3.2 is the first
# release that reads the archive as it is published now (docs/STORAGE.md §3).
easysnowdata = ">=0.3.2"

[feature.dev.dependencies]
jupyter = "*"
matplotlib = ">=3.8"
pytest = ">=8.0"
ruff = ">=0.4"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
fetch-stations   = "python -m scripts.create_all_stations_geojson"
fetch-data       = "python -m scripts.get_all_stations_data"
fetch-data-awdb  = "python -m scripts.get_all_stations_data --network awdb"
fetch-data-cdec  = "python -m scripts.get_all_stations_data --network cdec"
fetch-data-databc = "python -m scripts.get_all_stations_data --network databc"
fetch-data-nve   = "python -m scripts.get_all_stations_data --network nve"
fetch-data-yukon = "python -m scripts.get_all_stations_data --network yukon"
finalize-data    = "python -m scripts.get_all_stations_data --finalize-only --archive _site/all_station_csvs.tar.xz"
build-archive    = "python -m scripts.get_all_stations_data --archive-only --archive _site/all_station_csvs.tar.xz"
live-map         = "python -m scripts.generate_live_map"
zarr-archive     = "python -m scripts.build_zarr_archive --output _site/archive"
update-all       = { depends-on = ["fetch-stations", "fetch-data", "live-map"] }
# Everything left here is offline; the live client suites went to
# easysnowdata with the clients. `test-unit` keeps the marker filter so a
# future live test here is still excluded from the fast run.
test             = "pytest tests/ -v"
test-unit        = "pytest tests/ -v -m 'not live'"
