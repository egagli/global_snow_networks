[workspace]
name = "global-snow-networks"
version = "0.1.0"
description = "Archive and access tools for global snow point observations (SWE, snow depth) from AWDB, CDEC, DataBC, NVE, and Yukon AquaCache."
authors = ["Eric Gagliano <egagli@uw.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12"
ipykernel = "*"
numpy = ">=1.26"
pandas = ">=2.2"
geopandas = ">=1.0"
shapely = ">=2.0"
requests = ">=2.31"
lxml = ">=5.0"
tqdm = ">=4.66"
fsspec = ">=2026.3.0,<2027"
aiohttp = ">=3.13.4,<4"
beautifulsoup4 = ">=4.14.3,<5"

# The five network clients and the water-year helpers live in easysnowdata now
# (its REVAMP_PLAN §9.2 option B, and docs/EASYSNOWDATA_MIGRATION.md here).
# Pinned to a commit rather than a version because the release that first
# contains `easysnowdata.stations` is not out yet: conda-forge is at 0.0.24 and
# PyPI at 0.0.25. When 0.2 ships, this whole table becomes one line in
# [dependencies]: `easysnowdata = ">=0.2"`.
[pypi-dependencies]
easysnowdata = { git = "https://github.com/egagli/easysnowdata.git", rev = "480e638d6e3eb51712c8f3530a6a3ed7184207ed" }

[feature.dev.dependencies]
jupyter = "*"
matplotlib = ">=3.8"
pytest = ">=8.0"
ruff = ">=0.4"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
fetch-stations   = "python -m scripts.create_all_stations_geojson"
fetch-data       = "python -m scripts.get_all_stations_data"
fetch-data-awdb  = "python -m scripts.get_all_stations_data --network awdb"
fetch-data-cdec  = "python -m scripts.get_all_stations_data --network cdec"
fetch-data-databc = "python -m scripts.get_all_stations_data --network databc"
fetch-data-nve   = "python -m scripts.get_all_stations_data --network nve"
fetch-data-yukon = "python -m scripts.get_all_stations_data --network yukon"
finalize-data    = "python -m scripts.get_all_stations_data --finalize-only"
live-map         = "python -m scripts.generate_live_map"
update-all       = { depends-on = ["fetch-stations", "fetch-data", "live-map"] }
# Everything left here is offline; the live client suites went to
# easysnowdata with the clients. `test-unit` keeps the marker filter so a
# future live test here is still excluded from the fast run.
test             = "pytest tests/ -v"
test-unit        = "pytest tests/ -v -m 'not live'"
